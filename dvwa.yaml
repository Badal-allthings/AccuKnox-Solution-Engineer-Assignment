
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvwa
  namespace: dvwa-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dvwa
  template:
    metadata:
      labels:
        app: dvwa
    spec:
      containers:
        - name: dvwa
          image: vulnerables/web-dvwa
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dvwa
  namespace: dvwa-lab
spec:
  type: ClusterIP
  selector:
    app: dvwa
  ports:
    - port: 80
      targetPort: 80
